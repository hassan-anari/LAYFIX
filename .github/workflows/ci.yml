name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  AVALONIA_TELEMETRY_OPTOUT: 1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-contract:
    name: Documentation and agent contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository specification files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            README.md AGENTS.md CONTRIBUTING.md THIRD_PARTY_NOTICES.md
            docs/PRODUCT_SPEC.md docs/ARCHITECTURE.md docs/DESIGN_SYSTEM.md
            docs/ROADMAP.md docs/QUALITY_GATES.md docs/SECURITY_PRIVACY.md
            docs/DEVELOPMENT_WORKFLOW.md docs/RELEASE_PROCESS.md
            docs/REFERENCE_REPOS.md docs/DECISIONS.md
            .github/pull_request_template.md .github/workflows/ci.yml
          )
          for file in "${files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Missing or empty required specification file"
              exit 1
            fi
          done
          echo "Repository specification contract present; application checks run in the Windows job."

  windows:
    name: Windows .NET build, tests, portable package
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore Layfix.slnx --locked-mode
      - name: Release build
        run: dotnet build Layfix.slnx --configuration Release --no-restore
      - name: Automated tests including read-only Win32 smoke
        run: dotnet test Layfix.slnx --configuration Release --no-build --no-restore --logger "trx;LogFileName=test-results.trx"
      - name: Verify nonzero test counts and no skipped tests
        shell: pwsh
        run: ./build/verify-tests.ps1
      - name: Publish and verify unsigned self-contained win-x64 package
        shell: pwsh
        run: ./build/package.ps1
      - name: Published application lifecycle smoke test
        shell: pwsh
        run: ./build/smoke-portable.ps1
      - name: Upload machine-readable test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layfix-test-results
          path: "tests/**/TestResults/*.trx"
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LAYFIX-win-x64-portable
          path: |
            dist/LAYFIX-win-x64-portable.zip
            dist/LAYFIX-win-x64-portable.sha256
          if-no-files-found: error
          retention-days: 14
