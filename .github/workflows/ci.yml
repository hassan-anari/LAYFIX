name: CI

on:
  push:
    branches: [main, feat/upstream-layoutfixer-windows]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    name: Upstream provenance and license contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: python3 scripts/verify-provenance.py
      - name: Required notices and specifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for file in ['AGENTS.md', 'THIRD_PARTY_NOTICES.md', 'licenses/CC-BY-SA-4.0.txt',
                       'licenses/upstream/LICENSE', 'docs/SECURITY_AUDIT.md',
                       'docs/PRODUCT_SPEC.md', 'docs/ARCHITECTURE.md', 'docs/ROADMAP.md',
                       'docs/SECURITY_PRIVACY.md', 'docs/DEVELOPMENT_WORKFLOW.md']:
              assert Path(file).stat().st_size > 0, file
          PY

  windows:
    name: Windows source build, regression tests and audit package
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: .NET SDK pinned by global.json
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4.3.1
        with:
          global-json-file: global.json
      - name: Locked restore
        run: dotnet restore Layfix.slnx --locked-mode
      - name: Release build
        run: dotnet build Layfix.slnx -c Release --no-restore
      - name: Core regression tests (JUnit XML, nonzero on failure)
        run: dotnet run --project tests/LayoutFixer.Tests -c Release --no-build --no-restore -- TestResults/core.xml
      - name: Native Windows API tests (no interactive input)
        run: dotnet run --project tests/LayoutFixer.NativeTests -c Release --no-build --no-restore -- TestResults/native.xml
      - name: Validate machine-readable test totals
        shell: pwsh
        run: |
          foreach ($file in 'TestResults/core.xml', 'TestResults/native.xml') {
            [xml]$results = Get-Content $file
            $suite = $results.testsuites.testsuite
            if ([int]$suite.tests -lt 1 -or [int]$suite.failures -ne 0 -or [int]$suite.skipped -ne 0) {
              throw "Test gate failed: $file"
            }
          }
      - name: Publish self-contained unsigned audit build
        shell: pwsh
        run: |
          dotnet publish windows/LayoutFixer.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -p:RestoreLockedMode=true -o dist/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in 'LayoutFixer.exe', 'coreclr.dll', 'hostfxr.dll',
                           'data/en_50k.txt', 'data/fa_50k.txt', 'data/words.txt',
                           'THIRD_PARTY_NOTICES.md', 'licenses/upstream/LICENSE',
                           'licenses/CC-BY-SA-4.0.txt', 'SECURITY_AUDIT.md') {
            if (-not (Test-Path "dist/win-x64/$file")) { throw "Package missing $file" }
          }
          @{
            repository = '${{ github.repository }}'
            commit = '${{ github.sha }}'
            upstream = '969814d2dbb6819eaef984525ef11db4c3f48dca'
            run = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            sdk = (dotnet --version)
            globalObservation = 'BLOCKED'
            correction = 'BLOCKED'
            interactiveAcceptance = 'NOT RUN'
            signing = 'UNSIGNED'
          } | ConvertTo-Json | Set-Content dist/win-x64/BUILD_PROVENANCE.json -Encoding utf8
          Copy-Item provenance/import-commit.txt dist/win-x64/provenance/
          Compress-Archive -Path dist/win-x64/* -DestinationPath dist/LAYFIX-win-x64-portable.zip
          $hash = (Get-FileHash dist/LAYFIX-win-x64-portable.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LAYFIX-win-x64-portable.zip" | Set-Content dist/LAYFIX-win-x64-portable.zip.sha256 -Encoding ascii
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layfix-test-results
          path: TestResults/*.xml
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned portable ZIP and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LAYFIX-win-x64-portable
          path: |
            dist/LAYFIX-win-x64-portable.zip
            dist/LAYFIX-win-x64-portable.zip.sha256
          if-no-files-found: error
          retention-days: 14
